server:
  port: 8090

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/wms02?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:12345678}
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:}
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
      key-prefix: "wms:"
      use-key-prefix: true

ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
    api-url: https://api.deepseek.com/chat/completions
    base-url: https://api.deepseek.com
    model: deepseek-chat
    temperature: 0.5
    max-tokens: 2048
    max-memory-messages: 20
  zhipu:
    api-key: ${ZHIPU_API_KEY:your-zhipu-api-key}
    base-url: https://open.bigmodel.cn/api/paas/v4
    embedding-model: embedding-2
  knowledge-base:
    path: knowledge-base
    chunk-size: 300
    chunk-overlap: 30
    max-results: 3
    min-score: 0.6
    auto-load: true

Logging:
  level:
    com.wms: debug