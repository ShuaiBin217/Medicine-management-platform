name: Deploy Frontend to Server

on:
  push:
    branches: [main]
    paths:
      - 'wms-web/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "frontend-deploy"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wms-web/package-lock.json

      - name: Install dependencies
        run: cd wms-web && npm install

      - name: Build
        run: cd wms-web && npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload to nginx
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "rm -rf /usr/share/nginx/html/wms/*"
          scp -r wms-web/dist/. ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/usr/share/nginx/html/wms/
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "ls -lh /usr/share/nginx/html/wms/ | head -10"
