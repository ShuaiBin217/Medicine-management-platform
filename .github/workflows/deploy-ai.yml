name: Build and Deploy AI Service

on:
  push:
    branches: [main]
    paths:
      - 'wms-ai/**'
      - '.github/workflows/deploy-ai.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/wms-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./wms-ai
          file: ./wms-ai/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' <<'REMOTE'
          set -e
          IMAGE="ghcr.1ms.run/${{ github.repository }}/wms-ai:latest"

          echo "==> pulling $IMAGE"
          docker pull "$IMAGE"

          echo "==> extracting app from image"
          docker rm -f wms-ai-tmp >/dev/null 2>&1 || true
          docker create --name wms-ai-tmp "$IMAGE"
          rm -rf /root/wms-ai-app
          docker cp wms-ai-tmp:/app /root/wms-ai-app
          docker rm -f wms-ai-tmp

          echo "==> replacing app code in running container"
          docker cp /root/wms-ai-app/. wms-ai:/app/
          docker restart wms-ai

          echo "==> flushing redis cache"
          docker exec redis redis-cli FLUSHDB

          echo "==> waiting for ai service"
          code=000
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8091/health || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          docker logs --tail 30 wms-ai
          if [ "$code" != "200" ]; then
            echo "ai health check failed: $code"
            exit 1
          fi
          echo "ai deployed, http $code"
          REMOTE
