# WMS Nginx 反向代理配置
# /ai/* 和 /knowledge/* → Python AI 服务(8091)
# /goods/* /storage/* /goodstype/* /user/* /record/* /menu/* → Java 业务服务(8090)
# 其余 → 前端静态资源
#
# 部署：将此文件放到 /etc/nginx/conf.d/ 或 include 到 nginx.conf 的 http 块中

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/wms;
    index index.html;

    # AI 与知识库 → Python 服务
    # proxy_pass 不带末尾斜杠，保留 /ai /knowledge 前缀（Python 路由 prefix 匹配）
    location /ai/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;   # LLM 调用较慢
    }

    location /knowledge/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # 业务 API → Java 服务
    location ~ ^/(goods|storage|goodstype|user|record|menu|role)/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
    }

    # 前端静态资源 + Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }
}
