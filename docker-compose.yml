version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-12345678}
      MYSQL_DATABASE: wms02
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./wms/src/sql/table.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8 --collation-server=utf8_general_ci

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./wms
    ports:
      - "8090:8090"
    environment:
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-12345678}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-your-deepseek-api-key}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-your-zhipu-api-key}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/wms02?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
      SPRING_REDIS_HOST: redis
    depends_on:
      - mysql
      - redis

  frontend:
    build: ./wms-web
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data: